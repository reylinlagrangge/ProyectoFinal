<div id="cd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const themeMode = document.documentElement.dataset.mode;
const dark = themeMode ? themeMode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const src = `classDiagram
  class Laboratory {
    +int Id
    +string Name
    +string Country
    +Laboratory()
    +Laboratory(name, country)
  }
  class Medication {
    +int Id
    +string Name
    +decimal Price
    +int LaboratoryId
    +Medication()
    +Medication(name, price, laboratoryId)
  }
  class Batch {
    +int Id
    +string BatchNumber
    +int MedicationId
    +int Quantity
    +DateTime ExpirationDate
    +Batch()
    +Batch(batchNumber, medicationId, quantity, expirationDate)
  }
  class PharmacyService {
    -DataContext context
    +GetMedications() List
    +AddLaboratory(name, country) bool
    +AddMedication(name, price, labId) bool
    +AddBatch(number, medId, qty, date) bool
    +UpdateStock(batchId, qty) bool
  }
  class PharmacyReport {
    <<abstract>>
    +GenerateReport() string
    +PrintReport() void
  }
  class MedicationReport {
    +GenerateReport() string
  }
  class ExpirationReport {
    +GenerateReport() string
  }
  Laboratory "1" --> "many" Medication
  Medication "1" --> "many" Batch
  PharmacyService ..> Laboratory
  PharmacyService ..> Medication
  PharmacyService ..> Batch
  PharmacyReport <|-- MedicationReport
  PharmacyReport <|-- ExpirationReport`;
const { svg } = await mermaid.render('cd-svg', src);
document.getElementById('cd').innerHTML = svg;
document.querySelectorAll('#cd svg .node path[d]').forEach(p => {
  const d = p.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (p.hasAttribute(a)) rect.setAttribute(a, p.getAttribute(a));
  }
  p.replaceWith(rect);
});
</script>
